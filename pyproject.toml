[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "perfkit"
version = "0.1.0"
description = "Trade performance analysis package and backtesting bug fix"
requires-python = ">=3.9"
dependencies = [
    "pandas",
    "numpy",
]

[tool.setuptools.packages.find]
include = ["perfkit*", "part_a*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]